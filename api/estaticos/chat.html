<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Suporte Avendre (teste)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --roxo: #5b2a86;
    --roxo-claro: #7c4dab;
    --fundo: #f4f2f8;
    --texto: #24202b;
    --card: #ffffff;
    --borda: #e2ddec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fundo);
    color: var(--texto);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app { width: 100%; max-width: 720px; }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  header .logo {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--roxo), var(--roxo-claro));
    flex-shrink: 0;
  }
  header h1 { font-size: 20px; margin: 0; }
  header p { margin: 2px 0 0; font-size: 13px; color: #6b6575; }

  form {
    background: var(--card);
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 20px;
    display: grid;
    gap: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  label { font-size: 13px; font-weight: 600; color: #4a4553; }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--borda);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  .linha-dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    background: var(--roxo);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--roxo-claro); }
  button:disabled { opacity: .6; cursor: default; }

  #resultado { margin-top: 24px; display: grid; gap: 20px; }
  .aviso { font-size: 13px; color: #6b6575; text-align: center; padding: 20px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 2px 8px;
    border-radius: 999px;
    background: #ece6f7;
    color: var(--roxo);
  }

  /* explicacao gerada pela IA */
  .explicacao {
    background: linear-gradient(180deg, #f4effb, #ffffff);
    border: 1px solid #d9cdf0;
    border-radius: 14px;
    padding: 20px 22px;
  }
  .explicacao .rotulo {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; color: var(--roxo);
    text-transform: uppercase; letter-spacing: .04em;
    margin-bottom: 10px;
  }

  /* artigo principal - renderizado como no portal (marked.js) */
  .artigo-principal {
    background: var(--card);
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 22px 24px;
  }
  .artigo-principal .fonte {
    font-size: 12px; color: #8a8494; margin-bottom: 4px;
  }
  .artigo-principal .fonte a { color: var(--roxo); font-weight: 600; text-decoration: none; }

  /* conteudo markdown renderizado (compartilhado entre explicacao e artigo) */
  .md-conteudo h1, .md-conteudo h2, .md-conteudo h3 {
    color: var(--roxo);
    margin: 18px 0 8px;
  }
  .md-conteudo h1:first-child, .md-conteudo h2:first-child, .md-conteudo h3:first-child { margin-top: 0; }
  .md-conteudo p { margin: 0 0 10px; line-height: 1.6; font-size: 14px; }
  .md-conteudo ol, .md-conteudo ul { margin: 0 0 10px; padding-left: 22px; }
  .md-conteudo li { margin-bottom: 6px; line-height: 1.5; font-size: 14px; }
  .md-conteudo strong { color: var(--roxo); }
  .md-conteudo hr { border: none; border-top: 1px solid var(--borda); margin: 16px 0; }
  .md-conteudo img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    border: 1px solid var(--borda);
    display: block;
    margin: 10px 0;
  }

  /* artigos relacionados - lista compacta, so titulo + link */
  .relacionados-titulo {
    font-size: 12px; font-weight: 700; color: #8a8494;
    text-transform: uppercase; letter-spacing: .04em;
    margin: 4px 2px;
  }
  .relacionados { display: grid; gap: 8px; margin-top: 8px; }
  .relacionados a {
    display: block;
    background: var(--card);
    border: 1px solid var(--borda);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--texto);
    text-decoration: none;
  }
  .relacionados a:hover { border-color: var(--roxo-claro); color: var(--roxo); }
  .relacionados a .cat { display: block; font-size: 11px; font-weight: 700; color: var(--roxo); margin-bottom: 2px; }

  /* feedback */
  .feedback {
    display: flex; align-items: center; gap: 10px;
    justify-content: center;
    padding: 6px 0 4px;
  }
  .feedback span { font-size: 13px; color: #6b6575; }
  .feedback button {
    background: var(--card);
    color: var(--texto);
    border: 1px solid var(--borda);
    padding: 8px 14px;
    font-size: 18px;
    line-height: 1;
  }
  .feedback button:hover { background: #ece6f7; }
  .feedback button.selecionado { background: var(--roxo); border-color: var(--roxo); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"></div>
    <div>
      <h1>Suporte Avendre (pagina de teste)</h1>
      <p>Consulta direta ao endpoint /perguntar - nao e a interface final</p>
    </div>
  </header>

  <form id="form-pergunta">
    <div>
      <label for="pergunta">Sua pergunta</label>
      <textarea id="pergunta" rows="2" placeholder="Ex.: como troco minha senha do Avendre Pay?" required></textarea>
    </div>
    <div class="linha-dupla">
      <div>
        <label for="empresa">Empresa</label>
        <input id="empresa" placeholder="Ex.: Imobiliaria Teste" value="Teste manual" required>
      </div>
      <div>
        <label for="email">Seu e-mail</label>
        <input id="email" type="email" placeholder="voce@empresa.com" value="teste@avendre.com">
      </div>
    </div>
    <button type="submit" id="botao-enviar">Perguntar</button>
  </form>

  <div id="resultado"></div>
</div>

<script>
const form = document.getElementById('form-pergunta');
const resultadoEl = document.getElementById('resultado');
const botao = document.getElementById('botao-enviar');

function escaparHtml(texto) {
  const div = document.createElement('div');
  div.textContent = texto;
  return div.innerHTML;
}

function renderizarMarkdown(texto) {
  return marked.parse(texto || '');
}

function montarBlocoFeedback(perguntaId) {
  const bloco = document.createElement('div');
  bloco.className = 'feedback';
  bloco.innerHTML = `
    <span>Essa resposta ajudou?</span>
    <button type="button" data-util="true" title="Ajudou">👍</button>
    <button type="button" data-util="false" title="Nao ajudou">👎</button>
  `;

  bloco.querySelectorAll('button').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const util = btn.dataset.util === 'true';
      bloco.querySelectorAll('button').forEach((b) => (b.disabled = true));
      btn.classList.add('selecionado');
      try {
        await fetch(`/perguntar/${perguntaId}/feedback`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ util }),
        });
        bloco.querySelector('span').textContent = 'Obrigado pelo feedback!';
      } catch {
        bloco.querySelector('span').textContent = 'Nao foi possivel enviar o feedback agora.';
      }
    });
  });

  return bloco;
}

function renderizarResultados(dados) {
  resultadoEl.innerHTML = '';

  const cabecalho = document.createElement('div');
  cabecalho.className = 'aviso';
  cabecalho.innerHTML = dados.veio_do_cache ? '<span class="badge">resposta em cache</span>' : '';
  if (dados.veio_do_cache) resultadoEl.appendChild(cabecalho);

  if (dados.explicacao) {
    const explicacao = document.createElement('div');
    explicacao.className = 'explicacao';
    explicacao.innerHTML = `
      <div class="rotulo">Resposta da IA de suporte</div>
      <div class="md-conteudo">${renderizarMarkdown(dados.explicacao)}</div>
    `;
    resultadoEl.appendChild(explicacao);
  }

  if (dados.artigo_principal) {
    const artigo = dados.artigo_principal;
    const card = document.createElement('div');
    card.className = 'artigo-principal';
    card.innerHTML = `
      <span class="badge">${escaparHtml(artigo.categoria)} / ${escaparHtml(artigo.pasta)}</span>
      <div class="fonte" style="margin-top:8px;">
        <a href="${artigo.url}" target="_blank" rel="noopener">${escaparHtml(artigo.titulo)} &rarr;</a>
      </div>
      <div class="md-conteudo">${renderizarMarkdown(artigo.conteudo_markdown)}</div>
    `;
    resultadoEl.appendChild(card);
  }

  if (!dados.artigo_principal && !dados.explicacao) {
    const vazio = document.createElement('div');
    vazio.className = 'aviso';
    vazio.textContent = 'Nao encontramos nenhum artigo relevante para essa pergunta na base.';
    resultadoEl.appendChild(vazio);
  }

  const relacionados = (dados.resultados || []).slice(1); // o primeiro ja apareceu como artigo_principal
  if (relacionados.length) {
    const titulo = document.createElement('div');
    titulo.className = 'relacionados-titulo';
    titulo.textContent = 'Artigos relacionados';
    resultadoEl.appendChild(titulo);

    const lista = document.createElement('div');
    lista.className = 'relacionados';
    for (const r of relacionados) {
      const link = document.createElement('a');
      link.href = r.url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.innerHTML = `<span class="cat">${escaparHtml(r.categoria)} / ${escaparHtml(r.pasta)}</span>${escaparHtml(r.titulo)}`;
      lista.appendChild(link);
    }
    resultadoEl.appendChild(lista);
  }

  if (dados.id) {
    resultadoEl.appendChild(montarBlocoFeedback(dados.id));
  }
}

form.addEventListener('submit', async (evento) => {
  evento.preventDefault();
  botao.disabled = true;
  botao.textContent = 'Perguntando...';
  resultadoEl.innerHTML = '<div class="aviso">Buscando na base de conhecimento e gerando a explicacao...</div>';

  try {
    const resposta = await fetch('/perguntar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        pergunta: document.getElementById('pergunta').value,
        empresa_nome: document.getElementById('empresa').value,
        usuario_email: document.getElementById('email').value || null,
        k: 4,
      }),
    });

    if (!resposta.ok) {
      throw new Error('A API respondeu com erro (' + resposta.status + ')');
    }

    const dados = await resposta.json();
    renderizarResultados(dados);
  } catch (erro) {
    resultadoEl.innerHTML = `<div class="aviso">Erro ao consultar a API: ${escaparHtml(erro.message)}</div>`;
  } finally {
    botao.disabled = false;
    botao.textContent = 'Perguntar';
  }
});
</script>
</body>
</html>
